name: integration
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
permissions:
  contents: read
jobs:
  integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hive-2.3.9
            image: slachiewicz/hive-metastore:2.3.9
            build: true
            expect_version: "2.3"
            uris: "thrift://127.0.0.1:9083"
            user: ci
          - name: hive-3.1.3
            image: apache/hive:3.1.3
            expect_version: "3.1"
            uris: "thrift://127.0.0.1:9083"
            user: ci
          - name: hive-4.0.1
            image: apache/hive:4.0.1
            expect_version: "4.0"
            uris: "thrift://127.0.0.1:9083"
            user: ci
          - name: hive-4.2.1-binary
            image: apache/hive:4.2.1
            expect_version: "4.2"
            uris: "thrift://127.0.0.1:9083"
            user: ci
          - name: hive-4.2.1-http
            image: apache/hive:4.2.1
            expect_version: "4.2"
            uris: "http://127.0.0.1:9083/metastore"
            http: true
            user: ci
          - name: hive-4.2.1-tls
            image: apache/hive:4.2.1
            expect_version: "4.2"
            uris: "thrift://127.0.0.1:9083"
            tls: true
            user: ci
          - name: hive-4.2.1-https
            image: apache/hive:4.2.1
            expect_version: "4.2"
            uris: "https://127.0.0.1:9083/metastore"
            http: true
            tls: true
            user: ci
          - name: hive-4.2.1-kerberos
            image: apache/hive:4.2.1
            expect_version: "4.2"
            # Dialed by name so the client derives the service principal
            # hive/hms.example.com itself; the KDC step maps the name to
            # 127.0.0.1 in /etc/hosts.
            uris: "thrift://hms.example.com:9083"
            kerberos: true
            # Under SASL the identity is the Kerberos principal, not
            # set_ugi, so TestIdentity must expect the principal's short
            # name (Hadoop's default auth_to_local rule).
            user: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: Pull the Hive 2.3.9 image, or build it if unpublished (hive-2.3.9 only)
        if: matrix.build
        id: pull
        continue-on-error: true
        run: docker pull "${{ matrix.image }}"

      - uses: docker/setup-buildx-action@v4
        if: matrix.build && steps.pull.outcome == 'failure'

      - name: Build the Hive 2.3.9 image with layer cache (hive-2.3.9 only)
        if: matrix.build && steps.pull.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: test/docker/hive-2.3.9
          load: true
          push: false
          tags: ${{ matrix.image }}
          # Layers (including the archive.apache.org downloads) are cached in
          # the Actions cache; only the first build after a Dockerfile change
          # or cache eviction fetches the tarballs. Publish the image with the
          # hive-2.3.9-image workflow to skip this step entirely.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Locate the hcatalog server extensions (apache/hive images)
        if: "!matrix.build"
        id: hcat
        run: |
          # bin/hive builds the metastore classpath from lib/, auxlib/ and
          # HIVE_AUX_JARS_PATH only, so org.apache.hive.hcatalog.listener.
          # DbNotificationListener -- which writes the NOTIFICATION_LOG rows
          # TestNotifications reads -- is not loadable by default even
          # though the image ships the jar. Point HIVE_AUX_JARS_PATH at the
          # hcatalog jars when the image has them; when it does not, the
          # metastore starts with no listener and TestNotifications skips
          # rather than the container failing to come up.
          # Registered only as a transactional listener: DbNotificationListener
          # writes DB_NOTIFICATION_EVENT_ID_KEY_NAME as part of the
          # transactional commit, and a second, non-transactional copy of the
          # same listener then rejects its own overwrite of that read-only
          # parameter (IllegalStateException on create_database and friends).
          dir=/opt/hive/hcatalog/share/hcatalog
          if docker run --rm --entrypoint ls "${{ matrix.image }}" "$dir" >/dev/null 2>&1; then
            echo "aux_jars=$dir" >> "$GITHUB_OUTPUT"
            echo "listener_opts=-Dmetastore.transactional.event.listeners=org.apache.hive.hcatalog.listener.DbNotificationListener" >> "$GITHUB_OUTPUT"
          else
            echo "no hcatalog jars in $dir; the metastore will run without a notification listener"
          fi

      - name: Generate a throwaway CA and server keystore (TLS legs)
        if: matrix.tls
        id: tls
        run: |
          # A self-signed CA plus a server certificate for the address the
          # tests dial, bundled into a PKCS12 keystore the JVM reads
          # directly (metastore.keystore.type=PKCS12), so no keytool or
          # published image is needed. The CA lives only in this job: the
          # tests trust it through HMS_TLS_CA, and TestTLS asserts a client
          # without it is refused. The image runs as user "hive", hence the
          # world-readable modes.
          # The key-manager algorithm must be explicit: the HTTP transport's
          # Jetty SslContextFactory is handed the config value verbatim, and
          # its empty default fails with "KeyManagerFactory not available"
          # (the binary transport substitutes the JDK default itself).
          dir="$RUNNER_TEMP/tls"; mkdir -p "$dir"; cd "$dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout ca.key -out ca.crt -subj "/CN=hms-client-go integration CA"
          openssl req -newkey rsa:2048 -nodes \
            -keyout server.key -out server.csr -subj "/CN=localhost"
          printf 'subjectAltName=IP:127.0.0.1,DNS:localhost\nextendedKeyUsage=serverAuth\n' > san.cnf
          openssl x509 -req -days 2 -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -extfile san.cnf -out server.crt
          openssl pkcs12 -export -name hms -in server.crt -inkey server.key -certfile ca.crt \
            -passout pass:changeit -out keystore.p12
          chmod 644 ca.crt keystore.p12; chmod 755 "$dir"
          echo "mount=-v $dir:/tls:ro" >> "$GITHUB_OUTPUT"
          echo "opts=-Dmetastore.use.SSL=true -Dmetastore.keystore.path=/tls/keystore.p12 -Dmetastore.keystore.password=changeit -Dmetastore.keystore.type=PKCS12 -Dmetastore.keymanagerfactory.algorithm=SunX509" >> "$GITHUB_OUTPUT"
          echo "ca=$dir/ca.crt" >> "$GITHUB_OUTPUT"

      - name: Start the KDC sidecar (Kerberos leg)
        if: matrix.kerberos
        id: kdc
        run: |
          # An MIT KDC built from test/docker/kdc (apt-only, under a
          # minute) on a user-defined network so the metastore reaches it
          # as "kdc"; its keytabs land in a host directory both the
          # metastore container and the test runner mount. Port 88 is
          # published over TCP only, matching udp_preference_limit = 1 in
          # the runner's krb5.conf.
          #
          # The metastore needs three things beyond the -D flags: the
          # container krb5.conf at /etc/krb5.conf, its keytab, and a
          # core-site.xml that enables Hadoop security -- without it
          # UserGroupInformation's keytab login is a silent no-op and the
          # GSSAPI acceptor has no credentials. HIVE_CUSTOM_CONF_DIR is
          # safe here because the directory holds only core-site.xml: the
          # entrypoint symlinks files individually, so the image's own
          # hive-site.xml and Derby settings stay in place.
          conf="$GITHUB_WORKSPACE/test/docker/kdc"
          keytabs="$RUNNER_TEMP/keytabs"; mkdir -p "$keytabs"
          docker network create hmsnet
          docker build -t hms-kdc "$conf"
          docker run -d --name kdc --network hmsnet -p 88:88 -v "$keytabs:/keytabs" hms-kdc
          for i in $(seq 1 60); do
            [ -f "$keytabs/.ready" ] && break
            sleep 1
          done
          if [ ! -f "$keytabs/.ready" ]; then
            echo "KDC did not export its keytabs" >&2; docker logs kdc; exit 1
          fi
          ls -l "$keytabs"
          echo "127.0.0.1 hms.example.com" | sudo tee -a /etc/hosts
          {
            echo "run_args=--network hmsnet --hostname hms.example.com -v $keytabs:/keytabs:ro -v $conf/krb5-container.conf:/etc/krb5.conf:ro -v $conf/hive-conf:/custom-conf:ro --env HIVE_CUSTOM_CONF_DIR=/custom-conf"
            echo "opts=-Dmetastore.sasl.enabled=true -Dmetastore.kerberos.principal=hive/hms.example.com@EXAMPLE.COM -Dmetastore.kerberos.keytab.file=/keytabs/hive.keytab -Djava.security.krb5.conf=/etc/krb5.conf"
            echo "keytab=$keytabs/client.keytab"
            echo "krb5_conf=$conf/krb5-host.conf"
          } >> "$GITHUB_OUTPUT"

      - name: Start metastore container (binary TCP)
        if: "!matrix.http"
        run: |
          # steps.tls.outputs.* and steps.kdc.outputs.* are empty on the
          # plain legs, so the same command serves every binary leg.
          docker run -d --name hms -p 9083:9083 ${{ steps.tls.outputs.mount }} ${{ steps.kdc.outputs.run_args }} \
            --env SERVICE_NAME=metastore \
            --env HIVE_AUX_JARS_PATH="${{ steps.hcat.outputs.aux_jars }}" \
            --env SERVICE_OPTS="${{ steps.tls.outputs.opts }} ${{ steps.kdc.outputs.opts }} ${{ steps.hcat.outputs.listener_opts }}" \
            "${{ matrix.image }}"

      - name: Start metastore container (HTTP mode)
        if: matrix.http
        run: |
          # MetastoreConf applies -D system properties for every ConfVar,
          # and the image passes SERVICE_OPTS into HADOOP_CLIENT_OPTS, so
          # transport mode is switched without replacing the image's own
          # config directory (a mounted HIVE_CUSTOM_CONF_DIR displaces the
          # Derby settings and breaks schema init).
          docker run -d --name hms -p 9083:9083 ${{ steps.tls.outputs.mount }} \
            --env SERVICE_NAME=metastore \
            --env HIVE_AUX_JARS_PATH="${{ steps.hcat.outputs.aux_jars }}" \
            --env SERVICE_OPTS="-Dmetastore.server.thrift.transport.mode=http -Dmetastore.server.thrift.http.path=metastore ${{ steps.tls.outputs.opts }} ${{ steps.hcat.outputs.listener_opts }}" \
            "${{ matrix.image }}"

      - name: Wait for the metastore to start
        run: |
          # Probe the port from inside the container. Connecting to the
          # published host port is not a readiness check (docker-proxy
          # accepts before the JVM listens), and the metastore's INFO log
          # goes to a file on most images, so neither the host port nor
          # `docker logs` can be relied on.
          for i in $(seq 1 150); do
            if docker exec hms bash -c 'exec 3<>/dev/tcp/127.0.0.1/9083' 2>/dev/null; then
              echo "metastore is listening inside the container (after $((i*2))s)"
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=hms)" ]; then
              echo "metastore container exited" >&2
              docker logs hms || true
              exit 1
            fi
            sleep 2
          done
          echo "metastore did not become ready within the timeout" >&2
          docker logs hms || true
          exit 1

      - name: make test-docker
        env:
          HMS_URIS: ${{ matrix.uris }}
          HMS_EXPECT_VERSION: ${{ matrix.expect_version }}
          HMS_USER: ${{ matrix.user }}
          # Empty on the plain legs: the whole suite then dials without TLS
          # and TestTLS skips. On the TLS legs every dial trusts the job's CA
          # and TestTLS runs against the same endpoint.
          HMS_TLS_CA: ${{ steps.tls.outputs.ca }}
          HMS_TLS_URIS: ${{ matrix.tls && matrix.uris || '' }}
          # Empty on the other legs. On the Kerberos leg every dial
          # authenticates as client@EXAMPLE.COM from the KDC's keytab, with
          # KRB5_CONFIG pointing the client at the published KDC port.
          KRB5_CONFIG: ${{ steps.kdc.outputs.krb5_conf }}
          HMS_KRB5_URIS: ${{ matrix.kerberos && matrix.uris || '' }}
          HMS_KRB5_PRINCIPAL: ${{ matrix.kerberos && 'client@EXAMPLE.COM' || '' }}
          HMS_KRB5_KEYTAB: ${{ steps.kdc.outputs.keytab }}
        run: make test-docker

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs hms || true
          if [ -n "${{ steps.kdc.outputs.keytab }}" ]; then echo "===== kdc"; docker logs kdc || true; fi
