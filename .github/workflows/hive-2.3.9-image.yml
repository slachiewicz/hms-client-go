name: hive-2.3.9-image
# On-demand build of the Hive 2.3.9 metastore image used by the integration
# matrix. apache/hive publishes no 2.x image, so this one is built from
# test/docker/hive-2.3.9/Dockerfile and pushed to Docker Hub.
#
# Requires two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (an access token with read/write scope on the target repository).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        default: "2.3.9"
        required: true
      push:
        description: Push to Docker Hub (false builds only)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: test/docker/hive-2.3.9
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hive-metastore:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
