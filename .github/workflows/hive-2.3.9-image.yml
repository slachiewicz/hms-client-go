name: hive-2.3.9-image
# On-demand build of the Hive 2.3.9 metastore image used by the integration
# matrix. apache/hive publishes no 2.x image, so this one is built from
# test/docker/hive-2.3.9/Dockerfile and pushed to Docker Hub.
#
# Requires two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (an access token with read/write scope on the target repository).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        default: "2.3.9"
        required: true
      push:
        description: Push to Docker Hub (false builds only)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: test/docker/hive-2.3.9
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hive-metastore:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
