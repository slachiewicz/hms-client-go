connector.name=hive
hive.metastore.uri=thrift://127.0.0.1:9083
# file:/// warehouse locations shared with the metastore container.
fs.hadoop.enabled=true
# A Hive 4 metastore turns non-transactional managed tables into external
# ones, which Trino otherwise refuses to write to.
hive.non-managed-table-writes-enabled=true
