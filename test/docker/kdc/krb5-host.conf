# krb5.conf for the test runner (KRB5_CONFIG): the KDC's port 88 is
# published on the host over TCP only, so UDP is disabled outright rather
# than tried first and timed out.
[libdefaults]
    default_realm = EXAMPLE.COM
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    udp_preference_limit = 1

[realms]
    EXAMPLE.COM = {
        kdc = 127.0.0.1:88
    }

[domain_realm]
    .example.com = EXAMPLE.COM
    example.com = EXAMPLE.COM
