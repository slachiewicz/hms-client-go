# krb5.conf for the containers on the job's Docker network: the KDC is
# reachable by its container name. Mounted at /etc/krb5.conf in both the
# KDC and the metastore container.
[libdefaults]
    default_realm = EXAMPLE.COM
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    udp_preference_limit = 1

[realms]
    EXAMPLE.COM = {
        kdc = kdc:88
        admin_server = kdc:749
    }

[domain_realm]
    .example.com = EXAMPLE.COM
    example.com = EXAMPLE.COM
